# Build the page and publish it to GitHub Pages.
#
# Only the front end is built here. `public/graph/` is committed, so the 15 minutes
# of OSM and terrain processing behind it never runs in CI -- refreshing the data is
# `tools/build_all.sh` on a machine with the extract, and the result is committed
# like any other change.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never two deploys at once, and never cancel one half-done: a cancelled deploy can
# leave the site serving an incomplete upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # The routing model is the whole point of this project, so a deploy that would
      # ship a broken one should not get as far as building.
      - name: Test
        run: npm test

      # `npm run build` type-checks before it bundles, so a type error fails here too.
      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
